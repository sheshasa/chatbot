<!DOCTYPE html>

<head>

  <style>
    /* Basic CSS styling */
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }
    #chat-container, #history-container {
      width: 400px;
      margin: 20px auto;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #fff;
      padding: 10px;
    }
    #chat-container {
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }
    #chat-box {
      height: 300px;
      overflow-y: auto;
      border-bottom: 1px solid #ddd;
      padding: 10px;
    }
    .message {
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 5px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .message.user {
      background-color: #e0ffe0;
      align-self: flex-end;
      text-align: right;
    }
    .message.bot {
      background-color: #e0e0ff;
      align-self: flex-start;
      text-align: left;
    }
    #input-area {
      display: flex;
      padding: 10px;
    }
    #user-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 3px;
    }
    #submit-btn, #toggle-history-btn {
      margin-left: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 3px;
      background-color: #007BFF;
      color: #fff;
      cursor: pointer;
    }
    #submit-btn:hover, #toggle-history-btn:hover {
      background-color: #0056b3;
    }
    #history-container {
      display: none;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .history-item {
      border-bottom: 1px solid #ddd;
      padding: 5px;
      font-size: 0.9em;
    }
    /* Style for thinking indicator */
    .thinking {
      font-style: italic;
      color: #888;
    }
    /* Debug panel for developers */
    #debug-panel {
      width: 400px;
      margin: 10px auto;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #f5f5f5;
      display: none;
    }
    .match-info {
      margin-bottom: 5px;
      font-size: 0.8em;
      padding: 3px;
      background-color: #fff;
    }
    .match-info.selected {
      border-left: 3px solid green;
    }
  </style>
</head>

          { question: "How much experience do you have with AWS?", originalQuestion: "How many months/years of experience do you have in cloud platforms such as Azure, AWS, or Google Cloud?", threshold: 0.7 },
          { question: "Have you worked with Azure? For how long?", originalQuestion: "How many months/years of experience do you have in cloud platforms such as Azure, AWS, or Google Cloud?", threshold: 0.7 },
          { question: "How experienced are you with Google Cloud?", originalQuestion: "How many months/years of experience do you have in cloud platforms such as Azure, AWS, or Google Cloud?", threshold: 0.7 },
          { question: "What's your cloud platform expertise?", originalQuestion: "How many months/years of experience do you have in cloud platforms such as Azure, AWS, or Google Cloud?", threshold: 0.7 }
        ],
        
        // Demand/labor planning variants
        planningExp: [
          { question: "Have you worked in demand planning before?", originalQuestion: "* How many years of experience do you have in demand planning, labor planning, workforce planning, labor forecasting, or similar?", threshold: 0.7 },
          { question: "What's your experience with workforce planning?", originalQuestion: "* How many years of experience do you have in demand planning, labor planning, workforce planning, labor forecasting, or similar?", threshold: 0.7 },
          { question: "How long have you worked with labor forecasting?", originalQuestion: "* How many years of experience do you have in demand planning, labor planning, workforce planning, labor forecasting, or similar?", threshold: 0.7 },
          { question: "Do you have labor planning experience?", originalQuestion: "* How many years of experience do you have in demand planning, labor planning, workforce planning, labor forecasting, or similar?", threshold: 0.7 },
          { question: "How many years of demand planning experience do you have?", originalQuestion: "* How many years of experience do you have in demand planning, labor planning, workforce planning, labor forecasting, or similar?", threshold: 0.7 }
        ]
      };

      // Add all variants to the main qaPairs array
      for (const category in questionVariants) {
        questionVariants[category].forEach(variant => {
          // Find the original question in our qaPairs
          const originalPair = qaPairs.find(pair => pair.question === variant.originalQuestion);
          
          if (originalPair) {
            // Create a new entry with the variant and the original answer
            const newPair = {
              question: variant.question,
              answer: originalPair.answer,
              threshold: variant.threshold || originalPair.threshold || 0.5,
              // If the original is dynamic, copy that property
              ...(originalPair.dynamic && { dynamic: true, getAnswer: originalPair.getAnswer })
            };
            
            // Add to qaPairs
            qaPairs.push(newPair);
          }
        });
      }
    };

    // Run the function to add variants
    addQuestionVariants();

    // State to keep track of chat history
    let chatHistory = [];
    
    // DOM elements
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const submitBtn = document.getElementById('submit-btn');
    const historyContainer = document.getElementById('history-container');
    const toggleHistoryBtn = document.getElementById('toggle-history-btn');
    const toggleDebugBtn = document.getElementById('toggle-debug-btn');
    const debugPanel = document.getElementById('debug-panel');
    const matchDetails = document.getElementById('match-details');
    
    // Initial bot greeting
    addMessage("Hi! I'm your personal assistant. How can I help you today?", 'bot');
    
    // Event listeners
    submitBtn.addEventListener('click', handleUserInput);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleUserInput();
      }
    });
    
    toggleHistoryBtn.addEventListener('click', () => {
      historyContainer.style.display = historyContainer.style.display === 'none' ? 'block' : 'none';
    });
    
    toggleDebugBtn.addEventListener('click', () => {
      debugPanel.style.display = debugPanel.style.display === 'none' ? 'block' : 'none';
    });
    
    /**
     * Handles the user input, processes it, and adds bot response
     */
    function handleUserInput() {
      const text = userInput.value.trim();
      if (text === '') return;
      
      // Add user message to chat
      addMessage(text, 'user');
      userInput.value = '';
      
      // Show thinking indicator
      const thinkingId = addMessage("Thinking...", 'bot thinking');
      
      // Process after a slight delay to show "thinking" effect
      setTimeout(() => {
        const response = processUserInput(text);
        
        // Remove thinking indicator and add actual response
        document.getElementById(thinkingId).remove();
        addMessage(response, 'bot');
        
        // Store in history
        chatHistory.push({ question: text, answer: response });
        updateHistoryDisplay();
      }, 500);
    }
    
    /**
     * Adds a message to the chat box
     * @param {string} text - The message text
     * @param {string} sender - Either 'user' or 'bot'
     * @returns {string} The ID of the created message element
     */
    function addMessage(text, sender) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${sender}`;
      messageDiv.innerText = text;
      
      // Create a unique ID for the message
      const messageId = `msg-${Date.now()}`;
      messageDiv.id = messageId;
      
      chatBox.appendChild(messageDiv);
      
      // Scroll to bottom of chat
      chatBox.scrollTop = chatBox.scrollHeight;
      
      return messageId;
    }
    
    /**
     * Processes the user input and returns appropriate response
     * @param {string} input - The user input text
     * @returns {string} The bot's response
     */
    function processUserInput(input) {
      // Clear previous debug info
      matchDetails.innerHTML = '';
      
      // Find best matching question using cosine similarity
      const matchInfo = findBestMatch(input, qaPairs);
      
      // Display match details in debug panel
      displayMatchDetails(input, matchInfo);
      
      if (matchInfo.bestMatch) {
        // If the match has a dynamic answer, compute it
        if (matchInfo.bestMatch.dynamic && matchInfo.bestMatch.getAnswer) {
          return matchInfo.bestMatch.getAnswer();
        }
        return matchInfo.bestMatch.answer;
      } else {
        return "I'm not sure how to answer that question. Could you please try rephrasing it?";
      }
    }
    
    /**
     * Updates the history display with the current chat history
     */
    function updateHistoryDisplay() {
      historyContainer.innerHTML = '';
      
      // Show the last 100 interactions, most recent first
      const recentHistory = chatHistory.slice(-100).reverse();
      
      recentHistory.forEach((item, index) => {
        const historyItem = document.createElement('div');
        historyItem.className = 'history-item';
        historyItem.innerHTML = `<strong>Q:</strong> ${item.question}<br><strong>A:</strong> ${item.answer}`;
        historyContainer.appendChild(historyItem);
      });
    }
    
    /**
     * Displays match details in the debug panel
     * @param {string} input - The user input
     * @param {object} matchInfo - Information about the best match
     */
    function displayMatchDetails(input, matchInfo) {
      // Create header
      const header = document.createElement('div');
      header.innerHTML = `<strong>User Input:</strong> "${input}"`;
      matchDetails.appendChild(header);
      
      // Show best match
      if (matchInfo.bestMatch) {
        const bestMatchElem = document.createElement('div');
        bestMatchElem.className = 'match-info selected';
        bestMatchElem.innerHTML = `
          <strong>Best Match (${(matchInfo.bestMatchScore * 100).toFixed(2)}%):</strong> 
          "${matchInfo.bestMatch.question}"<br>
          <strong>Answer:</strong> ${matchInfo.bestMatch.answer}<br>
          <strong>Threshold:</strong> ${matchInfo.bestMatch.threshold || 0.5}
        `;
        matchDetails.appendChild(bestMatchElem);
      } else {
        const noMatchElem = document.createElement('div');
        noMatchElem.innerHTML = "<strong>No matches found above threshold</strong>";
        matchDetails.appendChild(noMatchElem);
      }
      
      // Show top 5 matches
      const topMatches = document.createElement('div');
      topMatches.innerHTML = "<br><strong>Top 5 Matches:</strong>";
      matchDetails.appendChild(topMatches);
      
      matchInfo.allMatches.slice(0, 5).forEach(match => {
        const matchElem = document.createElement('div');
        matchElem.className = 'match-info';
        matchElem.innerHTML = `
          <strong>(${(match.score * 100).toFixed(2)}%):</strong> 
          "${match.question}"<br>
          <strong>Answer:</strong> ${match.answer}<br>
          <strong>Threshold:</strong> ${match.threshold || 0.5}
        `;
        matchDetails.appendChild(matchElem);
      });
    }
    
    /**
     * Finds the best match for the user input among the qaPairs
     * @param {string} input - The user input
     * @param {Array} pairs - Array of question-answer pairs
     * @returns {object} Object containing best match and all matches
     */
    function findBestMatch(input, pairs) {
      const matches = pairs.map(pair => {
        // Calculate similarity score between input and question
        const score = calculateSimilarity(input.toLowerCase(), pair.question.toLowerCase());
        return {
          score,
          question: pair.question,
          answer: pair.dynamic && pair.getAnswer ? pair.getAnswer() : pair.answer,
          threshold: pair.threshold || 0.5,
          dynamic: pair.dynamic
        };
      });
      
      // Sort matches by score, highest first
      const sortedMatches = matches.sort((a, b) => b.score - a.score);
      
      // Find the best match that exceeds its threshold
      const bestMatch = sortedMatches.find(match => match.score >= match.threshold);
      
      return {
        bestMatch: bestMatch || null,
        bestMatchScore: bestMatch ? bestMatch.score : 0,
        allMatches: sortedMatches
      };
    }
    
    /**
     * Calculates similarity between two strings using a simple approach
     * @param {string} str1 - First string
     * @param {string} str2 - Second string
     * @returns {number} Similarity score between 0 and 1
     */
    function calculateSimilarity(str1, str2) {
      // Tokenize strings into words
      const words1 = str1.toLowerCase().split(/\W+/).filter(word => word.length > 0);
      const words2 = str2.toLowerCase().split(/\W+/).filter(word => word.length > 0);
      
      // Create sets of unique words
      const set1 = new Set(words1);
      const set2 = new Set(words2);
      
      // Count words common to both strings
      let intersection = 0;
      for (const word of set1) {
        if (set2.has(word)) {
          intersection++;
        }
      }
      
      // Calculate Jaccard similarity
      const union = set1.size + set2.size - intersection;
      if (union === 0) return 0;
      
      // Basic Jaccard similarity
      let similarity = intersection / union;
      
      // Bonus for key phrases
      // Look for phrases in str2 that appear in str1
      const keyPhrases = extractKeyPhrases(str2);
      let phraseBonus = 0;
      
      keyPhrases.forEach(phrase => {
        if (str1.includes(phrase)) {
          // Add bonus proportional to phrase length
          phraseBonus += phrase.length / 100;
        }
      });
      
      // Apply length penalty if questions are very different in length
      const lengthRatio = Math.min(str1.length, str2.length) / Math.max(str1.length, str2.length);
      const lengthPenalty = lengthRatio * 0.2; // max 20% penalty for length difference
      
      // Adjust similarity score with phrase bonus and length penalty
      similarity = similarity * (1 - lengthPenalty) + phraseBonus;
      
      // Ensure score is in 0-1 range
      return Math.min(Math.max(similarity, 0), 1);
    }
    
    /**
     * Extracts key phrases from a string
     * @param {string} text - The input text
     * @returns {Array} Array of key phrases
     */
    function extractKeyPhrases(text) {
      const phrases = [];
      
      // Split text into sentences
      const sentences = text.split(/[.!?]/);
      
      sentences.forEach(sentence => {
        // Get noun phrases (simple approach)
        const words = sentence.trim().split(/\s+/);
        
        // Extract 2-3 word phrases
        for (let i = 0; i < words.length - 1; i++) {
          phrases.push(words[i] + ' ' + words[i + 1]);
          
          if (i < words.length - 2) {
            phrases.push(words[i] + ' ' + words[i + 1] + ' ' + words[i + 2]);
          }
        }
      });
      
      return phrases;
    }
  </script>
